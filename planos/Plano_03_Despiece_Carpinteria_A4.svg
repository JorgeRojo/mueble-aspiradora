    <text x="15" y="97.10" font-family="Helvetica, Arial, sans-serif" font-size="2.1" fill="#000000">Fuente de Alimentación Conmutada 12V DC</text>
    <text x="76" y="97.10" font-family="Helvetica, Arial, sans-serif" font-size="2.1" font-weight="bold" fill="#000000">1 ud</text>
    <text x="88" y="97.10" font-family="Helvetica, Arial, sans-serif" font-size="2.1" font-weight="bold" fill="#000000">12V DC &gt;= 2A (24W)</text>
    <text x="120" y="97.10" font-family="Helvetica, Arial, sans-serif" font-size="2.0" fill="#000000">Alimentación actuadores</text>
    

    <rect x="0" y="99.50" width="148" height="7.2" fill="#ffffff" stroke="#000000" stroke-width="0.25"/>
