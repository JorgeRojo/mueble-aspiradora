    <text x="76" y="89.90" font-family="Helvetica, Arial, sans-serif" font-size="2.1" font-weight="bold" fill="#000000">1 ud</text>
    <text x="88" y="89.90" font-family="Helvetica, Arial, sans-serif" font-size="2.1" font-weight="bold" fill="#000000">Contactos secos 10A</text>
    <text x="120" y="89.90" font-family="Helvetica, Arial, sans-serif" font-size="2.0" fill="#000000">Modo Interlock (Puente H)</text>
    

    <rect x="0" y="92.30" width="148" height="7.2" fill="#ffffff" stroke="#000000" stroke-width="0.25"/>
