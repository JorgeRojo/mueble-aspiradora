    <text x="120" y="82.70" font-family="Helvetica, Arial, sans-serif" font-size="2.0" fill="#000000">2 en costados + 2 en P04</text>
    

    <rect x="0" y="85.10" width="148" height="7.2" fill="#ffffff" stroke="#000000" stroke-width="0.25"/>
