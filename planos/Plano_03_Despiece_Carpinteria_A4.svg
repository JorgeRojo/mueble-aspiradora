    <text x="76" y="104.30" font-family="Helvetica, Arial, sans-serif" font-size="2.1" font-weight="bold" fill="#000000">1 lote</text>
    <text x="88" y="104.30" font-family="Helvetica, Arial, sans-serif" font-size="2.1" font-weight="bold" fill="#000000">Con arandela M4</text>
    <text x="120" y="104.30" font-family="Helvetica, Arial, sans-serif" font-size="2.0" fill="#000000">Herrajes y unión tableros</text>
    

    <rect x="0" y="106.7" width="148" height="41.3" fill="#ffffff" stroke="#000000" stroke-width="0.45"/>
    <text x="4" y="111.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" font-weight="bold" fill="#000000">C. NOTAS DE ENSAMBLAJE Y APROVECHAMIENTO DE TABLEROS:</text>
    <text x="4" y="116.8" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• De los 2 tableros de 1200x600x15 mm se obtienen todas las piezas verticales ([P01] a [P05]).</text>
    <text x="4" y="121.6" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• De 1 único tablero de 1200x600x10 mm salen [P06] y [P07] (quedan 9 tableros de 10 mm intactos).</text>
    <text x="4" y="126.4" font-family="Helvetica, Arial, sans-serif" font-size="2.05" font-weight="bold" fill="#000000">• Los costados [P01] y [P02] NO llevan cajeado de rodapié: se cortan con 1 solo corte recto a 478 mm.</text>
    <text x="4" y="131.2" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• El nervio trasero [P05] (510x35x15 mm) se encola y atornilla entre [P01]/[P02] y bajo la tapa [P06]</text>
    <text x="6" y="135.8" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">para rigidizar toda la parte trasera superior sin restar espacio a la estación Dreame.</text>
    <text x="4" y="140.8" font-family="Helvetica, Arial, sans-serif" font-size="2.05" font-weight="bold" fill="#000000">• Ver Hojas de Corte 1/2 y 2/2 para los mapas de corte a escala y plantilla milimétrica de taladros.</text>
