    <circle cx="100.32" cy="56.32" r="1.20" fill="#ffffff" stroke="#000000" stroke-width="0.45"/>
    <circle cx="100.32" cy="56.32" r="0.5" fill="#000000"/>
    <line x1="98.22" y1="56.32" x2="102.42" y2="56.32" stroke="#000000" stroke-width="0.3"/>
    <line x1="100.32" y1="54.22" x2="100.32" y2="58.42" stroke="#000000" stroke-width="0.3"/>

  
    <circle cx="93.92" cy="70.40" r="1.20" fill="#ffffff" stroke="#000000" stroke-width="0.45"/>
    <circle cx="93.92" cy="70.40" r="0.5" fill="#000000"/>
