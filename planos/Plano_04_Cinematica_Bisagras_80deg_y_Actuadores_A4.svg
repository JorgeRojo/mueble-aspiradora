    <text x="4" y="6.8" font-family="Helvetica, Arial, sans-serif" font-size="3.45" font-weight="bold" fill="#000000">PLANO 04: CINEMÁTICA DEL MECANISMO (GAROSA 80° SIN MUELLES + ACTUADORES)</text>
    <text x="4" y="13.5" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" fill="#000000">Geometría exacta del cuadrilátero articulado (0° vs 80°), coordenadas de pivotes (O1, O2, P1, P2, A, B) y puente en H Zigbee</text>
    <text x="4" y="18.2" font-family="Helvetica, Arial, sans-serif" font-size="2.45" fill="#000000">PROYECTO: Mueble Aspiradora Cota Cero (540 x 478 x 620 mm) — Diseño Final Aprobado (Edición Impresión Tóner B/N)</text>
    <text x="181" y="6.8" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" fill="#000000">ESCALA: 1:3.1 (Cinemática)</text>
    <text x="181" y="16.5" font-family="Helvetica, Arial, sans-serif" font-size="2.55" font-weight="bold" fill="#000000">COTAS: Milímetros (mm)</text>
    <text x="235" y="6.8" font-family="Helvetica, Arial, sans-serif" font-size="2.65" font-weight="bold" fill="#000000">PLANO 04/06</text>
    <text x="235" y="16.5" font-family="Helvetica, Arial, sans-serif" font-size="2.5" font-weight="bold" fill="#000000">FECHA: 2026-11-01</text>
  </g>
