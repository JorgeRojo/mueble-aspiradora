    <line x1="128.81" y1="66.94" x2="133.21" y2="66.94" stroke="#000000" stroke-width="0.3"/>
    <line x1="131.01" y1="64.74" x2="131.01" y2="69.14" stroke="#000000" stroke-width="0.3"/>


  <text x="20.00" y="76.80" font-family="Helvetica, Arial, sans-serif" font-size="2.05" font-weight="bold" fill="#000000">Pivote Fijo A (-225.7, 41.3)</text>
  <text x="97.32" y="54.82" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="2.05" font-weight="bold" fill="#000000">O1 (-451, 124) →</text>
  <text x="90.50" y="70.80" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="2.05" font-weight="bold" fill="#000000">O2 (-431, 80) →</text>
  <text x="112.00" y="73.50" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="2.05" font-weight="bold" fill="#000000">↑ B(80°) = (-546.9, 90.8)</text>
  <text x="112.00" y="77.50" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="2.0" font-weight="bold" fill="#000000">Lo = 325.0 mm (+8.8°)</text>


  <g transform="translate(14, 109)">
    <rect x="0" y="0" width="140" height="67" fill="#ffffff" stroke="#000000" stroke-width="0.5"/>
    <rect x="0" y="0" width="140" height="6.5" fill="#ffffff" stroke="#000000" stroke-width="0.45"/>
    <text x="70" y="4.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="2.5" font-weight="bold" fill="#000000">
      2. ESQUEMA ELÉCTRICO PUENTE EN H (RELÉ ZIGBEE MHCOZY 2 CANALES — INTERLOCK)
    </text>
    <text x="4" y="12.0" font-family="Helvetica, Arial, sans-serif" font-size="2.1" font-weight="bold" fill="#000000">• Fuente 12V DC (&gt;= 2A) conectada a los contactos secos COM / NO / NC del relé MHCOZY 2CH:</text>
    <text x="6" y="17.2" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">- NC1 y NC2 puenteados a GND (-12V) | NO1 y NO2 puenteados a +12V DC.</text>
    <text x="6" y="22.2" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">- COM1 conectado al cable ROJO de ambos actuadores (en paralelo).</text>
    <text x="6" y="27.2" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">- COM2 conectado al cable NEGRO de ambos actuadores (en paralelo).</text>
    <line x1="3" y1="30.5" x2="137" y2="30.5" stroke="#000000" stroke-width="0.3"/>
    <text x="4" y="35.5" font-family="Helvetica, Arial, sans-serif" font-size="2.1" font-weight="bold" fill="#000000">• Funcionamiento con Enclavamiento por Hardware (Modo INTERLOCK obligatorio):</text>
    <text x="6" y="40.7" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">- Canal 1 ON (10 s): +12V en Rojo / GND en Negro → Actuadores extienden (215 → 325 mm, ABRE a 80°).</text>
    <text x="6" y="45.7" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">- Canal 2 ON (10 s): GND en Rojo / +12V en Negro → Actuadores retraen (325 → 215 mm, CIERRA a 0°).</text>
    <text x="6" y="50.7" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">- Finales de carrera internos integrados en cada actuador Dawnso Mini (corte automático al llegar al tope).</text>
    <text x="4" y="56.5" font-family="Helvetica, Arial, sans-serif" font-size="2.1" font-weight="bold" fill="#000000">• Automatización Home Assistant:</text>
    <text x="6" y="61.5" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">- Estado Dreame = cleaning → Activa Canal 1 (Abre portón) | Estado = docked (+15 s) → Activa Canal 2 (Cierra).</text>
  </g>


  <g transform="translate(158, 26)">
    <rect x="0" y="0" width="124" height="150" fill="#ffffff" stroke="#000000" stroke-width="0.55"/>
    <rect x="0" y="0" width="124" height="6.8" fill="#ffffff" stroke="#000000" stroke-width="0.5"/>
    <text x="62" y="4.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="2.55" font-weight="bold" fill="#000000">
      3. TABLA DE COORDENADAS Y ÁNGULOS DEL MECANISMO
    </text>

    <text x="4" y="12.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="bold" fill="#000000">A. PUNTOS FIJOS EN COSTADOS [P01] y [P02] (Cotas en mm):</text>
    <text x="5" y="17.5" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• Eje Superior Bisagra (O1): Y = -451.0 mm (a 27 mm del frente), Z = 124.0 mm.</text>
    <text x="5" y="22.3" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• Eje Inferior Bisagra (O2): Y = -431.0 mm (a 47 mm del frente), Z = 80.0 mm.</text>
    <text x="5" y="27.1" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• Pivote Trasero Actuador (A): Y = -225.7 mm (a 252.3 mm del frente), Z = 41.3 mm.</text>
    <text x="5" y="31.9" font-family="Helvetica, Arial, sans-serif" font-size="2.05" font-weight="bold" fill="#000000">• Longitudes de eslabones: Brazo L1 = 58.21 mm | Brazo L2 = 48.88 mm | d_P = 44.00 mm.</text>

    <line x1="3" y1="35.5" x2="121" y2="35.5" stroke="#000000" stroke-width="0.35"/>

    <text x="4" y="41.0" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="bold" fill="#000000">B. POSICIÓN CERRADA (θ = 0.0° — Portón vertical enrasado en Y = -478 mm):</text>
    <text x="5" y="46.0" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• Articulación superior puerta P1(0°): Y = -461.0 mm, Z = 84.0 mm (a 82 mm de base P04).</text>
    <text x="5" y="50.8" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• Articulación inferior puerta P2(0°): Y = -461.0 mm, Z = 40.0 mm (a 38 mm de base P04).</text>
    <text x="5" y="55.6" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• Ángulos eslabones bisagra: α1(0°) = -104.0° | α2(0°) = -127.9°.</text>
    <text x="5" y="60.4" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• Eje delantero actuador B(0°): Y = -440.0 mm, Z = 24.0 mm (a 22 mm de base P04).</text>
    <text x="5" y="65.2" font-family="Helvetica, Arial, sans-serif" font-size="2.05" font-weight="bold" fill="#000000">• Longitud actuador retraído: L_c = 215.00 mm exactos | Ángulo β_c = -4.6°.</text>

    <line x1="3" y1="68.8" x2="121" y2="68.8" stroke="#000000" stroke-width="0.35"/>

    <text x="4" y="74.3" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="bold" fill="#000000">C. POSICIÓN ABIERTA (θ = 80.0° — Portón abatido a 10.0° de la horizontal):</text>
    <text x="5" y="79.3" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• Articulación superior puerta P1(80°): Y = -509.1 mm, Z = 120.0 mm.</text>
    <text x="5" y="84.1" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• Articulación inferior puerta P2(80°): Y = -465.8 mm, Z = 112.4 mm.</text>
    <text x="5" y="88.9" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• Ángulos eslabones bisagra: α1(80°) = -176.1° (Δα1 = 72.1°) | α2(80°) = -137.0°.</text>
    <text x="5" y="93.7" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">• Eje delantero actuador B(80°): Y = -546.9 mm, Z = 90.8 mm.</text>
    <text x="5" y="98.5" font-family="Helvetica, Arial, sans-serif" font-size="2.05" font-weight="bold" fill="#000000">• Longitud actuador extendido: L_o = 325.00 mm exactos | Ángulo β_o = +8.8°.</text>
    <text x="5" y="103.3" font-family="Helvetica, Arial, sans-serif" font-size="2.05" font-weight="bold" fill="#000000">• Carrera consumida: 325.0 - 215.0 = 110.0 mm (100% del recorrido nominal).</text>

    <line x1="3" y1="106.9" x2="121" y2="106.9" stroke="#000000" stroke-width="0.35"/>

    <text x="4" y="112.4" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="bold" fill="#000000">D. VENTAJAS DE RETIRAR LOS MUELLES DE LAS BISAGRAS GAROSA:</text>
    <text x="5" y="117.4" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">1. Sin muelles oponiéndose al movimiento, los 2 actuadores de 150N (300N totales)</text>
    <text x="7" y="122.0" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">trabajan sin carga parásita, reduciendo el consumo eléctrico (&lt; 0.8A) y el ruido.</text>
    <text x="5" y="127.0" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">2. Las placas laterales de 15 mm no sufren tensión permanente cuando el portón</text>
    <text x="7" y="131.6" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">permanece cerrado o abierto, garantizando alineación perfecta a largo plazo.</text>
    <text x="5" y="136.6" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">3. El bloqueo mecánico irreversible del husillo de los actuadores mantiene el</text>
    <text x="7" y="141.2" font-family="Helvetica, Arial, sans-serif" font-size="2.05" fill="#000000">portón firmemente cerrado a 0° y firmemente sostenido a 80° sin oscilaciones.</text>
  </g>


